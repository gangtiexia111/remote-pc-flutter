workflows:
  # ============================================
  # iOS 构建（无签名，生成 .app）
  # v1.0.3: Codemagic cloud build
  # ============================================
  ios-build:
    name: iOS Build (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'develop'
          include: true
      cancel_previous_builds: true
    environment:
      flutter: stable
      xcode: latest
      vars:
        SAFE_MODE: "1"
    scripts:
      - name: Set up local properties
        script: echo "flutter.minSdkVersion=21" > android/local.properties
      - name: Install dependencies
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze --no-fatal-infos
      - name: Build iOS (no code signing)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
    publishing:
      email:
        recipients:
          - 2093098597@qq.com

  # ============================================
  # macOS 构建
  # v1.0.3: Codemagic cloud build + CryptoKit
  # ============================================
  macos-build:
    name: macOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'develop'
          include: true
      cancel_previous_builds: true
    environment:
      flutter: stable
      xcode: latest
      vars:
        SAFE_MODE: "1"
    scripts:
      - name: Set up local properties
        script: echo "flutter.minSdkVersion=21" > android/local.properties
      - name: Install dependencies
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze --no-fatal-infos
      - name: Build macOS release
        script: flutter build macos --release
    artifacts:
      - build/macos/Build/Products/Release/remote_pc.app
    publishing:
      email:
        recipients:
          - 2093098597@qq.com

  # ============================================
  # Android 构建（APK）
  # v1.0.3: Codemagic cloud build
  # ============================================
  android-build:
    name: Android Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
      cancel_previous_builds: true
    environment:
      flutter: stable
      vars:
        SAFE_MODE: "1"
    scripts:
      - name: Set up local properties
        script: echo "flutter.minSdkVersion=21" > android/local.properties
      - name: Install dependencies
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze --no-fatal-infos
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - 2093098597@qq.com

  # ============================================
  # Linux 构建
  # v1.0.3: Codemagic cloud build
  # ============================================
  linux-build:
    name: Linux Build
    instance_type: linux_x2
    max_build_duration: 60
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'develop'
          include: true
      cancel_previous_builds: true
    environment:
      flutter: stable
      vars:
        SAFE_MODE: "1"
    scripts:
      - name: Install system dependencies
        script: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
      - name: Install Dart dependencies
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze --no-fatal-infos
      - name: Build Linux release
        script: flutter build linux --release
    artifacts:
      - build/linux/x64/release/bundle/
    publishing:
      email:
        recipients:
          - 2093098597@qq.com
