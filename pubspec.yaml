name: remote_pc
description: Remote PC Control - Cross-platform remote control app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & 网络
  http: ^1.2.0
  
  # 加密 & 安全
  cryptography: ^2.7.0
  pointycastle: ^4.0.0
  
  # 存储
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.4
  
  # 设备信息
  device_info_plus: ^11.0.0
  
  # 权限
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
