name: Build All Platforms

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.32.8'
  SAFE_MODE: '1'

jobs:
  # ============================================
  # 代码检查
  # ============================================
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Check formatting
        run: dart format --set-exit-if-changed .

  # ============================================
  # Android 构建
  # ============================================
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: remote_pc_android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ============================================
  # iOS 构建 (macOS Runner)
  # ============================================
  build-ios:
    name: iOS Build
    runs-on: macos-14
    needs: analyze
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no code sign)
        run: flutter build ios --release --no-codesign

      - name: Package iOS artifact
        run: |
          mkdir -p artifacts
          cd build/ios/iphoneos
          zip -r ../../../artifacts/remote_pc_ios.zip Runner.app
          echo "iOS build size: $(du -sh ../../../artifacts/remote_pc_ios.zip | cut -f1)"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote_pc_ios
          path: artifacts/remote_pc_ios.zip
          retention-days: 30

  # ============================================
  # macOS 构建
  # ============================================
  build-macos:
    name: macOS Build
    runs-on: macos-14
    needs: analyze
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS artifact
        run: |
          mkdir -p artifacts
          cd build/macos/Build/Products/Release
          zip -r ../../../../../artifacts/remote_pc_macos.zip remote_pc.app
          echo "macOS build size: $(du -sh ../../../../../artifacts/remote_pc_macos.zip | cut -f1)"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote_pc_macos
          path: artifacts/remote_pc_macos.zip
          retention-days: 30

  # ============================================
  # Linux 构建
  # ============================================
  build-linux:
    name: Linux Build
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ninja-build libgtk-3-dev clang cmake pkg-config liblzma-dev libsecret-1-dev

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote_pc_linux
          path: build/linux/x64/release/bundle/**
          retention-days: 30
